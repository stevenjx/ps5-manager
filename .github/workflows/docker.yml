# =============================================================================
# CI：运行 go vet / go test，并构建多架构 Docker 镜像推送到 GitHub Container
# Registry（ghcr.io）。无需任何额外 Secret，使用内置的 GITHUB_TOKEN。
#
# 产出镜像：ghcr.io/stevenjx/ps5-manager:latest
#
# 提示：本项目使用 CGO（github.com/mattn/go-sqlite3），arm64 镜像需经 QEMU
# 模拟编译，首次构建可能耗时 10 分钟以上。若只需本机架构（amd64），
# 把下方 platforms 中的 linux/arm64 删掉即可显著提速。
# =============================================================================
name: Build Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) 质量校验：go vet + 单元测试
  # ---------------------------------------------------------------------------
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  # ---------------------------------------------------------------------------
  # 2) 构建镜像并推送（PR 只构建不推送）
  # ---------------------------------------------------------------------------
  docker:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
